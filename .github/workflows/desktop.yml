name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tauri bundle
        run: npm run tauri build -- --bundles ${{ matrix.os == 'macos-latest' && 'dmg' || 'msi' }}

